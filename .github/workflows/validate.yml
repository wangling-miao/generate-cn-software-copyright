name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PDF toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended poppler-utils
          # hyperref uses the Zapf Dingbats metric in texlive-fonts-recommended.
          xelatex --version
          pdfinfo -v
          pdftotext -v

      - name: Validate skill package
        run: python scripts/validate_skill.py .

      - name: Run smoke test
        run: python scripts/smoke_test.py
